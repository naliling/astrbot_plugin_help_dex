name: help_dex
display_name: help_dex（指令渲染）
desc: 一条指令，把机器人会的一切画成一张暗色科幻风图鉴。群里@一下就发图；背景、Logo、配色想换就换，发张图发条指令秒生效，不用碰文件不用重启。被拉进群时会自动发一条链接，指向一个只给自己人看的浅色网页版图鉴（顶部可自定义使用规则，每条指令能一键复制，还能按群定制），并顺手掐掉进群那一刻的 LLM 调用，免得跟群里别的机器人撞车
version: 0.5.2
author: 娜莉灵
repo: https://github.com/naliling/astrbot_plugin_help_dex
astrbot_version: ">=4.17.0"
